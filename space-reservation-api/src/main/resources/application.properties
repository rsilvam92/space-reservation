spring.application.name=space-reservation-api

# =========================
# DATABASE CONFIG
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/space_reservation
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# SERVER
# =========================
server.port=8080

# =========================
# PLATFORM BOOTSTRAP
# =========================
app.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.document=${SUPER_ADMIN_DOCUMENT:}

# =========================
# ACCOUNT AND INVITATIONS
# =========================
app.account.web-base-url=${RESM_WEB_BASE_URL:http://localhost:3000}
app.account.invitation-expiration-hours=${ADMIN_INVITATION_EXPIRATION_HOURS:48}
